 services:
  backend:
    build:
      context: ./backend-api
      dockerfile: Assessment.Api/Dockerfile

    container_name: assessment-backend

    env_file:
      - .env

    ports:
      - "5209:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: assessment-frontend

    ports:
      - "4200:80"

    depends_on:
      - backend